<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>✓ Minha Lista de Tarefas</h1>
      <p class="subtitle">Organize suas tarefas de forma simples e eficaz</p>
    </header>

    <div class="input-section">
      <div class="input-group">
        <input 
          type="text" 
          id="todoInput" 
          class="todo-input" 
          placeholder="Digite uma nova tarefa..."
          autocomplete="off"
        >
        <button id="addBtn" class="add-btn">+ Adicionar</button>
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="active">Ativas</button>
        <button class="filter-btn" data-filter="completed">Concluídas</button>
      </div>
    </div>

    <div class="stats-section">
      <div class="stat">
        <span class="stat-number" id="totalTasks">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="activeTasks">0</span>
        <span class="stat-label">Ativas</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="completedTasks">0</span>
        <span class="stat-label">Concluídas</span>
      </div>
    </div>

    <div class="todos-container" id="todosList"></div>

    <div class="empty-state" id="emptyState">
      <p>📝 Nenhuma tarefa ainda</p>
      <p class="empty-subtitle">Adicione uma nova tarefa para começar!</p>
    </div>

    <div class="action-buttons">
      <button id="clearCompletedBtn" class="clear-btn">Limpar Concluídas</button>
      <button id="clearAllBtn" class="clear-all-btn">Limpar Tudo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
